name: Diagnose function suites

on:
  push:
    branches: [testing]

permissions:
  contents: read
  statuses: write

jobs:
  errors:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        shell: bash
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DWARNINGS_AS_ERRORS=ON
      - name: Compile and capture
        shell: bash
        run: |
          cmake --build build --target tests --parallel 2 > build-log.txt 2>&1 || true
          grep -E -m 12 'error:|fatal error:|FAILED:|warning:' build-log.txt > errors.txt || true
          if [ ! -s errors.txt ]; then tail -n 12 build-log.txt > errors.txt; fi
          while IFS= read -r msg; do
            n=$((n+1))
            description=$(printf "%s" "$msg" | cut -c1-130)
            jq -n --arg context "migration/compile-$n" --arg description "$description" '{state:"failure",context:$context,description:$description}' |
              curl -fsSL -X POST -H "Authorization: Bearer ${{ github.token }}" -H "Accept: application/vnd.github+json" -H "Content-Type: application/json" --data-binary @- https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}
            if [ "$n" -ge 10 ]; then break; fi
          done < errors.txt
