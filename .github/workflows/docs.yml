name: Documentation prototype
on:
  push:
    branches: [docs-doxygen-markdown]
  pull_request:
    paths:
      - 'doc/**'
      - 'cmake/UseDoxygen.cmake'
      - 'scripts/build_doc_markdown.py'
      - 'CMakeLists.txt'
      - '.github/workflows/docs.yml'
jobs:
  documentation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install documentation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz
          npm install --global moxygen@2.1.19
      - name: Test public XML filtering
        run: python3 -m unittest discover -s tests -p 'test_doc_markdown.py'
      - name: Configure documentation
        run: cmake -S . -B build-docs -DDOXYFILE_LATEX=OFF
      - name: Generate HTML and Markdown
        run: cmake --build build-docs --target doc-markdown
      - name: Verify outputs
        run: |
          test -f build-docs/docs/html/index.html
          test -f build-docs/docs/xml/index.xml
          python3 - <<'PY'
          from pathlib import Path
          pages = list(Path('build-docs/docs/markdown').rglob('*.md'))
          print(f"Generated {len(pages)} Markdown pages")
          assert len(pages) >= 2, "Expected API index and API detail pages"
          assert not any("agevaluepair" in p.name.lower() or "call_impl" in p.name.lower() for p in pages), "Private nested types leaked into public Markdown"
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: utility-doxygen-documentation
          path: |
            build-docs/docs/html/
            build-docs/docs/xml/
            build-docs/docs/markdown/
          retention-days: 14
