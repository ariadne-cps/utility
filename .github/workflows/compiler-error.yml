name: Compiler error summary

on:
  push:
    branches:
      - testing

permissions:
  contents: read
  statuses: write

jobs:
  reproduce:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: sudo apt-get install -y cmake ninja-build g++-13
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=g++-13 -DWARNINGS_AS_ERRORS=ON
      - name: Build isolated test with captured diagnostics
        run: |
          set -o pipefail
          cmake --build build --target test_stack_trace --parallel 2 2>&1 | tee compiler-diagnostics.txt
      - name: Publish first compiler error to commit status
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          error=$(grep -m1 -E 'error:|fatal error:|undefined reference|LNK[0-9]+' compiler-diagnostics.txt | cut -c1-135 || true)
          if [ -z "$error" ]; then error="Build failed; no compiler diagnostic found"; fi
          jq -n --arg error "$error" '{state:"failure",context:"testing-migration/first-compiler-error",description:$error}' |
            curl --fail-with-body -sSL -X POST -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/json" --data-binary @- "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}"
